<html lang="en">
<head>
  <meta charset="utf-8">
  <title>lxr-radial</title>
  <link rel="stylesheet" href="lxr-ui.css">

</head>
<body class="lxr">
  <div id="wheel" class="rd lxr-hidden">
    <svg id="ring" class="rd__ring" viewBox="-200 -200 400 400"></svg>
    <div class="rd__center" id="center">
      <img class="rd__logo" src="img/lxrcore-logo.png" alt="">
      <span class="rd__label" id="label"></span>
      <span class="rd__sub lxr-mono" id="sub"></span>
    </div>
    <div class="rd__hints lxr-mono lxr-t-smoke"><span class="lxr-key">RMB</span><span id="h-back"></span><span class="lxr-key">Esc</span><span id="h-close"></span></div>
  </div>
  <script src="app.js"></script>
